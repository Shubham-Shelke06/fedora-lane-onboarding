---
- name: Create GitLab Project
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Display onboarding request
      ansible.builtin.debug:
        msg: "Creating GitLab project for {{ developer_name }}"

    - name: Simulate GitLab project creation
      ansible.builtin.debug:
        msg: "GitLab project {{ gitlab_project }} created successfully for {{ developer_username }}"

    - name: Confirm project creation
      ansible.builtin.debug:
        msg: "GitLab project setup completed successfully."
